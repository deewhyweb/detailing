# fly.toml app configuration file generated for hayes-detailing on 2026-11-03T18:24:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hayes-detailing'
primary_region = 'ams'

[build]

[env]
  CONTACT_TO = 'info@hayes-detailing.com'
  # Sent through Resend so messages arrive in the Google inbox as normal incoming mail.
  SMTP_HOST = 'smtp.resend.com'
  SMTP_PORT = '465'
  SMTP_SECURE = 'true'
  SMTP_USER = 'resend'
  CONTACT_FROM = 'Hayes Detailing Website <info@hayes-detailing.com>'
  # SMTP_PASS is the Resend API key (a secret): fly secrets set SMTP_PASS='re_...'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
